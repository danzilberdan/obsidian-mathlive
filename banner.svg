<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&amp;family=Ubuntu+Mono:wght@400;700&amp;display=swap');
      
      .title { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 86px; fill: #ffffff; letter-spacing: -1px; }
      .title-accent { fill: #10b981; }
      .subtitle { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 28px; fill: #d1d5db; letter-spacing: 2px; text-transform: uppercase; }
      .tagline { font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 24px; fill: #9ca3af; }
      
      .code-comment { font-family: 'Ubuntu Mono', monospace; font-weight: 400; font-size: 20px; fill: #6b7280; }
      .code-blue { font-family: 'Ubuntu Mono', monospace; font-weight: 700; font-size: 22px; fill: #60a5fa; }
      .code-yellow { font-family: 'Ubuntu Mono', monospace; font-weight: 400; font-size: 22px; fill: #fbbf24; }
      .code-white { font-family: 'Ubuntu Mono', monospace; font-weight: 400; font-size: 22px; fill: #e5e7eb; }
      .code-green { font-family: 'Ubuntu Mono', monospace; font-weight: 700; font-size: 22px; fill: #34d399; }
      
      .code-small-gray { font-family: 'Ubuntu Mono', monospace; font-weight: 400; font-size: 14px; fill: #9ca3af; }
      .code-small-green { font-family: 'Ubuntu Mono', monospace; font-weight: 700; font-size: 14px; fill: #34d399; }

      .cursor { animation: blink 1.2s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
    
    <!-- Grid Pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#374151" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
    
    <!-- Radial Glows -->
    <radialGradient id="glowLeft" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0e1013" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0e1013" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0e1013"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Glows -->
  <rect width="100%" height="100%" fill="url(#glowLeft)"/>
  <rect width="100%" height="100%" fill="url(#glowRight)"/>

  <!-- Left Text Section -->
  <g transform="translate(120, 260)">
    <text x="0" y="-30" class="subtitle">Obsidian Plugin</text>
    <text x="0" y="50" class="title">Math<tspan class="title-accent">Live</tspan></text>
    <text x="0" y="110" class="tagline">Visual LaTeX Editor &amp; Cloud OCR</text>
    
    <!-- Decorative line -->
    <rect x="0" y="150" width="80" height="6" fill="#10b981" rx="3"/>
  </g>

  <!-- Right Window Section -->
  <g transform="translate(580, 124)">
    <!-- Brutalist Shadow -->
    <rect x="12" y="12" width="500" height="340" rx="12" fill="#10b981" />
    
    <!-- Window Background (base) -->
    <rect x="0" y="0" width="500" height="340" rx="12" fill="#1a1d23" />
    
    <!-- Header Background -->
    <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 488 0 C 494.627 0 500 5.373 500 12 L 500 48 L 0 48 L 0 12 Z" fill="#0e1013" />
    
    <!-- Footer Background -->
    <path d="M 0 300 L 500 300 L 500 328 C 500 334.627 494.627 340 488 340 L 12 340 C 5.373 340 0 334.627 0 328 L 0 300 Z" fill="#0e1013" />

    <!-- Window Border (drawn on top) -->
    <rect x="0" y="0" width="500" height="340" rx="12" fill="none" stroke="#374151" stroke-width="2"/>
    
    <!-- Header/Footer internal dividers -->
    <line x1="0" y1="48" x2="500" y2="48" stroke="#374151" stroke-width="2"/>
    <line x1="0" y1="300" x2="500" y2="300" stroke="#374151" stroke-width="2"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="24" r="6" fill="#ef4444"/>
    <circle cx="44" cy="24" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="24" r="6" fill="#10b981"/>

    <!-- Tab text -->
    <text x="100" y="30" class="code-small-gray">equation.tex</text>

    <!-- Code Content -->
    <g transform="translate(30, 90)">
      <text x="0" y="0" class="code-comment">%% MathLive Visual Editor &amp; OCR</text>
      
      <text x="0" y="45" class="code-blue">\begin<tspan class="code-white">{</tspan><tspan class="code-yellow">equation</tspan><tspan class="code-white">}</tspan></text>
      
      <text x="30" y="90" class="code-green">\int<tspan class="code-white">_{</tspan><tspan class="code-yellow">-\infty</tspan><tspan class="code-white">}^{</tspan><tspan class="code-yellow">\infty</tspan><tspan class="code-white">}</tspan></text>
      
      <text x="30" y="135" class="code-white">e^{-x^2} dx = \sqrt{\pi}</text>
      
      <text x="0" y="180" class="code-blue">\end<tspan class="code-white">{</tspan><tspan class="code-yellow">equation</tspan><tspan class="code-white">}</tspan></text>
      
      <!-- Blinking Cursor -->
      <rect x="305" y="118" width="12" height="22" fill="#10b981" class="cursor"/>
    </g>

    <!-- Bottom Status Bar Items -->
    <circle cx="24" cy="320" r="4" fill="#10b981"/>
    <text x="38" y="325" class="code-small-gray">Render Status: Success</text>
    <text x="350" y="325" class="code-small-green">Cloud OCR: Ready</text>
  </g>
</svg>
