name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"
  # Release from the Actions tab: tags master's head with `version` and publishes it, for when a tag
  # can't be pushed. `dry_run` builds and checks without tagging or publishing.
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (must match manifest.json on master)
        required: true
      dry_run:
        description: Build and check only
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PLUGIN_NAME: MathLive
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: npm

      - name: Check the version
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "$(node -p 'require("./manifest.json").version')" = "$VERSION" || { echo "manifest.json is not $VERSION"; exit 1; }
          ! git ls-remote --exit-code --tags origin "refs/tags/$VERSION" || { echo "tag $VERSION already exists"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Lint and type check
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Tags like 2.0.0-staging.1 talk to the staging server, for testing before a release.
          MATHLIVE_ORIGIN: ${{ contains(env.VERSION, '-staging') && 'https://mathlive-staging.danz.blog' || '' }}

      - name: Attest build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Release with Notes
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.PLUGIN_NAME }} ${{ env.VERSION }}
          generate_release_notes: true
          # Test builds (any tag with a "-") are pre-releases, installed only through BRAT.
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: |
            main.js
            manifest.json
            styles.css
