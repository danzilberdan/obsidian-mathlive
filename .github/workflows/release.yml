name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  PLUGIN_ID: mathlive
  PLUGIN_NAME: MathLive

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run build
          mkdir ${{ env.PLUGIN_ID }}
          cp main.js manifest.json styles.css ${{ env.PLUGIN_ID }}
          zip -r ${{ env.PLUGIN_ID }}-${{ github.ref_name }}.zip ${{ env.PLUGIN_ID }}

      - name: Release with Notes
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.PLUGIN_NAME }} ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
            ${{ env.PLUGIN_ID }}-${{ github.ref_name }}.zip
