name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PLUGIN_NAME: MathLive

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and type check
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Tags like 2.0.0-staging.1 talk to the staging server, for testing before a release.
          MATHLIVE_ORIGIN: ${{ contains(github.ref_name, '-staging') && 'https://mathlive-staging.danz.blog' || '' }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Release with Notes
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.PLUGIN_NAME }} ${{ github.ref_name }}
          generate_release_notes: true
          # Test builds (any tag with a "-") are pre-releases, installed only through BRAT.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            main.js
            manifest.json
            styles.css
