<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&amp;family=Ubuntu+Mono:wght@400;700&amp;display=swap');
      .title { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 20px; fill: #ffffff; }
      .text { font-family: 'Montserrat', sans-serif; font-weight: 400; font-size: 16px; fill: #d1d5db; }
      .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 40px; fill: #ffffff; }
      .math-sym { font-family: 'Times New Roman', serif; font-size: 44px; fill: #10b981; }
      .latex { font-family: 'Ubuntu Mono', monospace; font-weight: 400; font-size: 18px; fill: #60a5fa; }
      .latex-keyword { fill: #c084fc; }
      .latex-bracket { fill: #9ca3af; }
      .bg-base { fill: #0e1013; }
      .bg-surface { fill: #1a1d23; }
      .border { stroke: #374151; stroke-width: 2; }
      .shadow { fill: #10b981; }
      
      .cursor { animation: blink 1.2s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#374151" stroke-width="1" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#0e1013"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Background Editor -->
  <rect x="20" y="20" width="760" height="360" rx="12" class="bg-base border" />
  <!-- Window Controls -->
  <circle cx="44" cy="40" r="6" fill="#ef4444"/>
  <circle cx="64" cy="40" r="6" fill="#f59e0b"/>
  <circle cx="84" cy="40" r="6" fill="#10b981"/>
  <line x1="20" y1="64" x2="780" y2="64" class="border"/>
  
  <!-- Obsidian Editor Content Mock -->
  <text x="44" y="104" class="title" fill="#9ca3af">Gaussian Integral</text>
  <text x="44" y="144" class="text" fill="#6b7280">The Gaussian integral, also known as the EulerPoisson integral, is equal to the square root of pi.</text>
  <rect x="44" y="164" width="300" height="30" fill="#10b981" rx="4" opacity="0.15"/>
  <rect x="44" y="164" width="300" height="30" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="4 4" rx="4"/>
  <text x="44" y="224" class="text" fill="#6b7280">This integral has wide applications in mathematics and physics.</text>

  <!-- MathLive Modal Shadow -->
  <rect x="128" y="108" width="544" height="240" rx="12" class="shadow" />
  
  <!-- MathLive Modal -->
  <rect x="120" y="100" width="544" height="240" rx="12" class="bg-surface border" />
  <text x="144" y="136" class="title">MathLive Editor</text>
  <line x1="120" y1="152" x2="664" y2="152" class="border"/>
  
  <!-- Visual Editor Area -->
  <rect x="144" y="172" width="496" height="88" rx="6" fill="#0e1013" class="border"/>
  
  <!-- Rendered Math -->
  <g transform="translate(220, 230)">
    <!-- Integral symbol -->
    <text x="0" y="0" class="math-sym">+</text>
    <!-- Lower limit -->
    <text x="14" y="14" class="math" font-size="18">-</text>
    <!-- Upper limit -->
    <text x="20" y="-36" class="math" font-size="18"></text>
    
    <!-- e^{-x^2} -->
    <text x="55" y="0" class="math">e</text>
    <text x="75" y="-20" class="math" font-size="22">-x</text>
    <text x="96" y="-30" class="math" font-size="16">2</text>
    
    <!-- dx -->
    <text x="115" y="0" class="math" font-style="normal">d<tspan font-style="italic">x</tspan></text>
    
    <!-- = -->
    <text x="165" y="0" class="math">=</text>
    
    <!-- \sqrt{\pi} -->
    <text x="205" y="2" class="math-sym"></text>
    <line x1="225" y1="-26" x2="255" y2="-26" stroke="#10b981" stroke-width="3"/>
    <text x="230" y="0" class="math">À</text>
    
    <!-- Cursor -->
    <rect x="265" y="-30" width="3" height="36" fill="#10b981" class="cursor"/>
  </g>

  <!-- LaTeX Output / Keyboard hint -->
  <rect x="144" y="280" width="496" height="40" rx="6" fill="#0e1013" class="border"/>
  <text x="156" y="306" class="latex">
    <tspan class="latex-keyword">\int</tspan>
    <tspan class="latex-bracket">_{</tspan>-\infty<tspan class="latex-bracket">}^{</tspan>\infty<tspan class="latex-bracket">}</tspan> 
    e<tspan class="latex-bracket">^{</tspan>-x^2<tspan class="latex-bracket">}</tspan> dx = 
    <tspan class="latex-keyword">\sqrt</tspan><tspan class="latex-bracket">{</tspan>\pi<tspan class="latex-bracket">}</tspan>
  </text>
</svg>